<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Paste Gate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0e0c09;--surf:#1c1812;--surf2:#252019;--bdr:rgba(201,169,110,.18);
  --tx:#e8dccf;--txm:#9a8a78;--ac:#c9a96e;--lo:#7aad6e;--hi:#e05a5a;--me:#d49542;}
body{width:320px;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;font-size:13px;}
header{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--bdr);}
.hlogo{width:28px;height:28px;background:var(--ac);border-radius:8px;display:flex;align-items:center;justify-content:center;}
.htitle{font-size:15px;font-weight:600;color:var(--ac);}
.hsub{font-size:11px;color:var(--txm);}
.body{padding:14px;}
textarea{width:100%;height:110px;background:var(--surf);border:1px solid var(--bdr);border-radius:10px;
  color:var(--tx);font-size:12px;padding:10px;resize:none;outline:none;font-family:inherit;line-height:1.5;}
textarea::placeholder{color:var(--txm);}
textarea:focus{border-color:var(--ac);}
.btn{width:100%;margin-top:10px;padding:10px;background:var(--ac);color:#0e0c09;
  border:none;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;}
.btn:hover{background:#d4b87a;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.result{margin-top:12px;background:var(--surf2);border:1px solid var(--bdr);border-radius:10px;padding:12px;display:none;}
.result-label{font-size:10px;color:var(--txm);font-family:monospace;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
.result-text{font-size:12px;line-height:1.6;color:var(--tx);word-break:break-word;}
.rtag{background:rgba(201,169,110,.12);color:var(--ac);border-radius:3px;padding:0 3px;font-family:monospace;font-size:11px;}
.badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.badge{font-size:10px;font-family:monospace;padding:2px 8px;border-radius:4px;border:1px solid;}
.badge.hi{color:var(--hi);background:rgba(224,90,90,.1);border-color:rgba(224,90,90,.3);}
.badge.me{color:var(--me);background:rgba(212,149,74,.1);border-color:rgba(212,149,74,.3);}
.badge.lo{color:var(--lo);background:rgba(122,173,110,.1);border-color:rgba(122,173,110,.3);}
.copy-btn{font-size:11px;color:var(--ac);background:none;border:1px solid var(--bdr);border-radius:6px;
  padding:3px 10px;cursor:pointer;margin-top:8px;display:none;}
.copy-btn:hover{border-color:var(--ac);}
.spinner{display:none;width:16px;height:16px;border:2px solid rgba(14,12,9,.3);border-top-color:#0e0c09;
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
footer{padding:10px 14px;border-top:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;}
.footer-link{font-size:11px;color:var(--txm);text-decoration:none;}
.footer-link:hover{color:var(--ac);}
</style>
</head>
<body>
<header>
  <div class="hlogo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0e0c09" stroke-width="2.2" stroke-linecap="round">
      <path d="M12 2L4 6v6c0 5.25 3.5 10 8 12 4.5-2 8-6.75 8-12V6L12 2z"/>
      <polyline points="9 12 11 14 15 10"/>
    </svg>
  </div>
  <div>
    <div class="htitle">Paste Gate</div>
    <div class="hsub">Powered by Aria · 3-agent pipeline</div>
  </div>
</header>

<div class="body">
  <textarea id="inp" placeholder="Paste text here to scrub PII and secrets…"></textarea>
  <button class="btn" id="btn" onclick="scrub()">
    <span id="btnTxt">Scrub with Aria</span>
    <div class="spinner" id="spin"></div>
  </button>

  <div id="timer" style="display:none;text-align:center;font-size:11px;color:var(--ac);font-family:monospace;margin-top:8px;padding:6px;background:var(--surf2);border-radius:8px;border:1px solid var(--bdr);"></div>

  <div class="result" id="result">
    <div class="result-label">Scrubbed output</div>
    <div class="result-text" id="resultText"></div>
    <div class="badges" id="badges"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyResult()">Copy clean text</button>
  </div>
</div>

<footer>
  <a class="footer-link" href="https://paste-gate-crew.onrender.com" target="_blank">Open full app</a>
  <span class="footer-link" id="sk"></span>
</footer>

<script>
let lastScrubbed = '';

async function scrub() {
  const raw = document.getElementById('inp').value.trim();
  if (!raw) return;
  const btn = document.getElementById('btn');
  const btnTxt = document.getElementById('btnTxt');
  btn.disabled = true;
  btnTxt.textContent = '⏳ Working…';
  document.getElementById('result').style.display = 'none';
  document.getElementById('copyBtn').style.display = 'none';
  const timerEl = document.getElementById('timer');
  timerEl.style.display = 'block';
  const steps = ['🔍 Scrubber scanning…','⚖️ Judge reviewing…','📋 Reporter writing…'];
  let secs = 0;
  const ticker = setInterval(() => {
    secs++;
    const step = steps[Math.min(Math.floor(secs/8), steps.length-1)];
    timerEl.textContent = `${step} ${secs}s`;
  }, 1000);
  timerEl.textContent = `${steps[0]} 0s`;

  // send to background worker — survives popup closing
  chrome.runtime.sendMessage({type: 'SCRUB_POPUP', text: raw}, (resp) => {
    clearInterval(ticker);
    document.getElementById('timer').style.display = 'none';
    btn.disabled = false;
    btnTxt.textContent = 'Scrub with Aria';

    if (!resp || !resp.ok) {
      document.getElementById('resultText').textContent = 'Error: ' + (resp?.error || 'no response');
      document.getElementById('result').style.display = 'block';
      return;
    }
    const d = resp.data;
    lastScrubbed = d.scrubbed_text;
    const html = d.scrubbed_text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\[([A-Z_]+_?\d*)\]/g, '<span class="rtag">[$1]</span>');
    document.getElementById('resultText').innerHTML = html;
    const rl = d.risk_level==='high'?'hi':d.risk_level==='medium'?'me':'lo';
    const rlbl = {hi:'HIGH RISK',me:'MED RISK',lo:'LOW RISK'}[rl];
    document.getElementById('badges').innerHTML =
      `<span class="badge ${rl}">${rlbl}</span>` +
      `<span class="badge lo">${d.entities_found} entit${d.entities_found!==1?'ies':'y'} redacted</span>`;
    document.getElementById('sk').textContent = d.session_key;
    document.getElementById('result').style.display = 'block';
    document.getElementById('copyBtn').style.display = 'inline-block';
  });
}

function copyResult() {
  navigator.clipboard.writeText(lastScrubbed).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy clean text', 1500);
  });
}

document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) scrub();
});
</script>
</body>
</html>
